services:
  # PROMETHEUS

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: figvibe-prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    ports:
      - '9090:9090'

    networks:
      - monitoring

    depends_on:
      - alertmanager

    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3

  # ALERTMANAGER

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: figvibe-alertmanager
    restart: unless-stopped

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

    ports:
      - '9093:9093'

    networks:
      - monitoring

    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9093/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3

  # LOKI

  loki:
    image: grafana/loki:3.3.2
    container_name: figvibe-loki
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/loki-config.yml

    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

    expose:
      - '3100'

    networks:
      - monitoring

    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 5s
      retries: 3

  # GRAFANA ALLOY

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: figvibe-alloy
    restart: unless-stopped

    command:
      - run
      - /etc/alloy/config.alloy

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro

      # Docker container discovery/log collection
      - /var/run/docker.sock:/var/run/docker.sock:ro

    expose:
      - '12345'

    networks:
      - monitoring

    depends_on:
      - loki

  # GRAFANA OSS

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: figvibe-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'

    ports:
      - '3000:3000'

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - monitoring

    depends_on:
      prometheus:
        condition: service_healthy

      loki:
        condition: service_healthy

    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # REDIS

  redis:
    image: redis:7-alpine
    container_name: figvibe-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - 'yes'

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

    networks:
      - monitoring

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

# NETWORKS

networks:
  monitoring:
    driver: bridge

# VOLUMES

volumes:
  redis_data:
  grafana_data:
  loki_data:
  prometheus_data:
  alertmanager_data:
