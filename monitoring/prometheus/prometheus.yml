global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'figvibe-monitor'

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'figvibe-backend'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5000']
