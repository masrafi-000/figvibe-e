global:
  resolve_timeout: 5m

route:
  receiver: 'discord-notifications'
  group_by: ['alertname', 'severity', 'job']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: 'discord-notifications'
    discord_configs:
      - webhook_url: 'https://discord.com/api/webhooks/1557157835266203689/1G_c1V7zhOgzE1YJjfvxneilSicVmvwbMHNTe0Ov7PR3HLJSuao49FS6t60Dh0UOi4Fc'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🚨 [FIRING:{{ .Alerts.Firing | len }}] {{ else }}✅ [RESOLVED] {{ end }}{{ .CommonLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          **Status:** {{ .Status | toUpper }}
          **Summary:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Severity:** `{{ .Labels.severity }}`
          **Started At:** {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          ---
          {{ end }}
